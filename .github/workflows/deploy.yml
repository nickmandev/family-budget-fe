name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (build, lint, test)
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Upload production build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: family-budget-fe-dist
          path: dist/family-budget-fe/browser
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: family-budget-fe-dist
          path: dist/family-budget-fe/browser
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is empty or missing."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID secret is empty or missing."
            exit 1
          fi
      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projects="$(npx wrangler pages project list --json)"
          if PROJECTS_JSON="$projects" node -e '
              let projects;
              try {
                projects = JSON.parse(process.env.PROJECTS_JSON);
              } catch (error) {
                console.error("Could not parse Cloudflare Pages project list:", error.message);
                process.exit(2);
              }
              if (!Array.isArray(projects)) {
                console.error("Cloudflare Pages project list did not return an array.");
                process.exit(2);
              }
              process.exit(projects.some((project) => project["Project Name"] === "family-budget-fe") ? 0 : 1);
            '
          then
            echo "Cloudflare Pages project family-budget-fe already exists."
          else
            project_status=$?
            if [ "$project_status" -eq 1 ]; then
              npx wrangler pages project create family-budget-fe --production-branch=main
            else
              exit "$project_status"
            fi
          fi
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy --project-name=family-budget-fe --commit-dirty=true
