<main class="flex min-h-screen items-center justify-center bg-violet-50 px-4 py-12">
  <section class="w-full max-w-lg rounded-2xl border border-violet-100 bg-white p-8 text-center shadow-lg shadow-violet-900/5 sm:p-10">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-violet-100 text-2xl font-bold text-violet-700" aria-hidden="true">✓</div>
    <h1 class="mt-5 text-2xl font-bold text-slate-900">{{ heading }}</h1>
    @if (note) {
      <p class="mt-3 text-sm leading-6 text-slate-600">{{ note }}</p>
    }
    <nav class="mt-8 flex flex-wrap justify-center gap-3" aria-label="Continue">
      <a routerLink="/households" class="rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-500 px-5 py-3 text-sm font-semibold text-white shadow-md shadow-violet-500/20 hover:from-violet-700 hover:to-fuchsia-600">Households</a>
      <a routerLink="/dashboard" class="rounded-xl border border-violet-200 px-5 py-3 text-sm font-semibold text-violet-700 hover:bg-violet-50">Dashboard</a>
    </nav>
  </section>
</main>
