<div class="relative">
  <button
    type="button"
    class="flex items-center gap-2 rounded-lg border border-violet-700/50 bg-violet-900/50 px-3 py-1.5 text-sm text-violet-100 transition-all hover:bg-violet-900"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    (click)="toggle()"
  >
    <span class="max-w-[10rem] truncate">
      {{ current()?.name ?? 'No household' }}
    </span>
    <svg
      class="h-4 w-4 shrink-0 transition-transform"
      [class.rotate-180]="open()"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (open()) {
    <button
      type="button"
      class="fixed inset-0 z-40 cursor-default"
      (click)="close()"
      aria-label="Close household menu"
      tabindex="-1"
    ></button>

    <div
      class="absolute right-0 z-50 mt-2 w-64 overflow-hidden rounded-2xl border border-violet-100 bg-white shadow-2xl"
      role="menu"
    >
      <div class="border-b border-violet-100 px-4 py-3">
        <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">
          Households
        </p>
      </div>

      <ul class="max-h-64 overflow-y-auto py-1">
        @for (household of households(); track household.id) {
          <li>
            <button
              type="button"
              role="menuitem"
              class="flex w-full items-center justify-between gap-2 px-4 py-2.5 text-left text-sm text-slate-700 transition-colors hover:bg-violet-50"
              (click)="selectHousehold(household.id)"
            >
              <span class="truncate">{{ household.name }}</span>
              @if (household.id === selectedId()) {
                <svg
                  class="h-4 w-4 shrink-0 text-violet-600"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
              }
            </button>
          </li>
        } @empty {
          <li class="px-4 py-3 text-sm text-slate-500">No households yet.</li>
        }
      </ul>

      <div class="border-t border-violet-100 p-2">
        <button
          type="button"
          class="flex w-full items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-violet-700 transition-colors hover:bg-violet-50"
          (click)="createHousehold()"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Create Household
        </button>
      </div>
    </div>
  }
</div>
